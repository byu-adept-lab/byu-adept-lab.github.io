<nav class="navbar" aria-label="Primary">
  <div class="container">
    <div class="navbar-brands">
      <a class="navbar-byu" href="https://byu.edu">
        <img src="{{ '/assets/img/byu-wordmark-white.svg' | relative_url }}" alt="Brigham Young University" width="80" height="23">
      </a>

      <a class="navbar-brand" href="{{ '/' | relative_url }}">
        <span class="mark" aria-hidden="true">
          <img src="{{ '/assets/img/adept-mark-white.png' | relative_url }}" alt="">
        </span>
        <span class="navbar-brand-text">
          <span class="navbar-brand-name">{{ site.title }}</span>
          <span class="navbar-brand-sub">{{ site.institution }}</span>
        </span>
      </a>
    </div>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <ul class="navbar-nav" id="site-menu">
      {%- for item in site.data.nav %}
      {%- assign item_url = item.url | relative_url %}
      <li>
        <a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
      {%- endfor %}
    </ul>
  </div>
</nav>

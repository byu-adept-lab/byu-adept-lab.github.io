        - text: "Code"
          url: "https://github.com/matthewlanders/BraVE"

    - title: "SAINT: Attention-Based Policies for Discrete Combinatorial Action Spaces"
      authors: "Matt Landers, <strong>Taylor W. Killian</strong>, Tom Hartvigsen, Afsaneh Doryab"
      venue: "arXiv pre-print"
      description: "A permutation-invariant policy architecture that treats a combinatorial action as an unordered set and models sub-action dependencies with self-attention, holding up in environments with up to 1.35 x 10^18 possible actions."
      featured: true
      areas: [structured-action-spaces]
      links:
        - text: "Paper"
          url: "https://arxiv.org/abs/2505.12109"
        - text: "Code"

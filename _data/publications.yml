# Lab-relevant publications, grouped by year (newest year first) and newest
# first within a year. A fuller list, including work outside the lab's themes,
# lives on the PI's site: https://twkillian.github.io/publications/
#
# To add a paper, drop a block under the right year (add a new `- year:` group
# at the top if the year does not exist yet):
#
#   - title: "Paper title, sentence case or title case — be consistent"
#     authors: "First Author, <strong>Taylor W. Killian</strong>, Last Author"
#     venue: "NeurIPS 2027"
#     description: "One or two sentences. Optional."
#     featured: true            # true surfaces it in short/selected lists
#     areas: [offline-reinforcement-learning]   # optional; slugs must match _research/*.md
#                                               # filenames. Drives the "relevant work"
#                                               # list on each research area page. Omit
#                                               # when a paper does not belong to an area.
#     links:
#       - text: "Paper"
#         url: "https://arxiv.org/abs/…"
#       - text: "Code"
#         url: "https://github.com/…"
#
# `authors` is rendered as HTML, which is why <strong> works. PDFs hosted on
# the PI's site must use absolute URLs — they are not files on this site.

- year: 2026
  papers:
    - title: "When EOS Tokens Disagree: Understanding Length Inflation in On-Policy Distillation"
      authors: "Yuxiao Yang, <strong>Tianrun Yu</strong>, Shangzhe Li, <strong>Kaixiang Zhao</strong>, Xuchao Zhang, Chetan Bansal, Huaxiu Yao, <strong>Taylor W. Killian</strong>, Weitong Zhang"
      venue: "arXiv pre-print"
      description: "On-policy distillation can suppress a student's preferred end-of-sequence token when the teacher uses a different but equivalent stopping token, causing severe length inflation. Aggregating equivalent EOS probabilities into one semantic stopping action substantially reduces excessive responses and truncation across Qwen3, Llama, and Gemma."
      featured: false
      links:
        - text: "Website"
          url: "https://uncsciml.github.io/opd-eos-website/"
        - text: "Paper"
          url: "https://arxiv.org/abs/2609.20511"
        - text: "Code"
          url: "https://github.com/UNCSciML/opd-eos"

    - title: "Improving and Accelerating Offline RL in Large Discrete Action Spaces with Structured Policy Initialization"
      authors: "Matt Landers, <strong>Taylor W. Killian</strong>, Tom Hartvigsen, Afsaneh Doryab"
      venue: "ICLR 2026"
      description: "SPIN is a two-stage framework for reinforcement learning in combinatorial action spaces: first pre-train an Action Structure Model that learns which joint actions are valid, then train lightweight control heads on top. It outperforms prior methods by up to 39% in reward while converging up to 12.8x faster."
      featured: true
      areas: [offline-reinforcement-learning, structured-action-spaces]
      links:
        - text: "Paper"
          url: "https://twkillian.github.io/papers/SPIN_LandersKillianHartvigsenDoryab_ICLR26.pdf"
        - text: "Code"
          url: "https://github.com/matthewlanders/SPIN"

    - title: "IsoCompute Playbook: Optimally Scaling Sampling Compute for LLM RL"
      authors: "Zhoujun Cheng, Yutao Xie, Yuxiao Qu, Amrith Setlur, Shibo Hao, Varad Pimpalkhute, Tongtong Liang, Feng Yao, Zhengzhong Liu, Eric Xing, Virginia Smith, Ruslan Salakhutdinov, Zhiting Hu, <strong>Taylor W. Killian</strong>, Aviral Kumar"
      venue: "ICML 2026"
      description: "Scaling laws for LLM reinforcement learning: how to allocate a fixed compute budget across parallel rollouts, problem batch size, and update steps. Increasing rollouts per problem turns out to be the primary driver, improving solution quality on easy tasks and coverage on hard ones."
      featured: true
      links:
        - text: "Website"
          url: "https://compute-optimal-rl-llm-scaling.github.io/"
        - text: "Paper"
          url: "https://arxiv.org/abs/2603.12151"

    - title: "From Reasoning Traces to Reusable Modules: Reinforcement Learning for Compositional Generalization in Language Model Reasoning"
      authors: "Lingjing Kong, Xin Liu, Guangyi Chen, Martin Q. Ma, Xiangchen Song, Yuekai Sun, Mikhail Yurochkin, <strong>Taylor W. Killian</strong>, Ruslan Salakhutdinov, Kun Zhang, Eric P. Xing, Zhengzhong Liu"
      venue: "ICML 2026"
      description: "RL lets language models achieve compositional generalization by extracting and recombining reusable atomic modules from reasoning traces. RL's exploratory nature supplies the coverage needed to identify the latent structure, and training on compound traces generalizes better than training on isolated modules."
      featured: false

    - title: "Behavior Cue Reasoning: Monitorable Reasoning Improves Efficiency and Safety through Oversight"
      authors: "Christopher Z. Cui, <strong>Taylor W. Killian</strong>, Prithviraj Ammanabrolu"
      venue: "arXiv pre-print"
      description: "Training language models to emit special tokens before specific behaviors makes their reasoning legible enough to supervise. Weak monitors prune up to 50% of wasted reasoning tokens, and in safety-constrained environments the approach recovers safe actions from 80% of otherwise-failing traces."
      featured: false
      links:
        - text: "Paper"
          url: "https://arxiv.org/abs/2605.07021"
        - text: "Code"
          url: "https://github.com/christopherzc/behavior-cues"

    - title: "Efficient Agentic Reasoning Through Self-Regulated Simulative Planning"
      authors: "Mingkai Deng, Jinyu Hou, Lara Sá Neves, Varad Pimpalkhute, <strong>Taylor W. Killian</strong>, Zhengzhong Liu, Eric P. Xing"
      venue: "arXiv pre-print"
      description: "SR²AM splits agent decision-making into simulative reasoning over a world model, self-regulation that decides when planning is worth it, and reactive execution. Planning only when necessary matches much larger models while using 25.8–95.3% fewer reasoning tokens."
      featured: false
      links:
        - text: "Paper"
          url: "https://arxiv.org/abs/2605.22138"
        - text: "Code"
          url: "https://github.com/sailing-lab/sr2am"

    - title: "LARK: Learnability-Grounded Trajectory Selection for Efficient Reasoning Distillation"
      authors: "Tianrun Yu, Kaixiang Zhao, Chih-Chun Chen, Amanda Hughes, <strong>Taylor W. Killian</strong>, Fenglong Ma, Weitong Zhang, Porter Jenkins"
      venue: "arXiv pre-print"
      description: "Selects teacher-generated reasoning trajectories by what the student can actually learn from, measured as how quickly a trajectory reduces training loss, balanced against distributional coverage — rather than by heuristics like quality or confidence."
      featured: false
      links:
        - text: "Paper"
          url: "https://arxiv.org/abs/2605.30651"
        - text: "Code"
          url: "https://github.com/Tianrun-Yu/LARK"

- year: 2025
  papers:
    - title: "BraVE: Offline Reinforcement Learning for Discrete Combinatorial Action Spaces"
      authors: "Matt Landers, <strong>Taylor W. Killian</strong>, Hugo Barnes, Tom Hartvigsen, Afsaneh Doryab"
      venue: "NeurIPS 2025"
      description: "Offline RL in high-dimensional discrete action spaces, using tree-structured traversal to capture sub-action dependencies. Only a linear number of joint actions need to be evaluated, outperforming existing methods by up to 20x in complex environments."
      featured: true
      areas: [offline-reinforcement-learning, structured-action-spaces]
      links:

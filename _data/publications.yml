    - title: "Robust Autonomy Emerges from Self-Play"
      authors: "Marco Cusumano-Towner, David Hafner, Alex Hertzberg, Brody Huval, Aleksei Petrenko, Eugene Vinitsky, Erik Wijmans, <strong>Taylor W. Killian</strong>, Stuart Bowers, Ozan Sener, Philipp Krähenbühl, Vladlen Koltun"
      venue: "ICML 2025"
      description: "A robust simulated driving agent trained by self-play at massive scale, in a simulator built for extensive parallelism so each agent's physical and behavioral characteristics could be aggressively randomized."
      featured: false
      links:
        - text: "Paper"
          url: "https://arxiv.org/abs/2502.03349"

    - title: "Concise Reasoning in the Lens of Lagrangian Optimization"
      authors: "Chengqian Gao, Haonan Li, <strong>Taylor W. Killian</strong>, Jianshu She, Renxi Wang, Liqun Ma, Zhoujun Cheng, Shibo Hao, Zhiqiang Xu"

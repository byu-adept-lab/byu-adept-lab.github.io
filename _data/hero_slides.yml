# Hero slideshow — photographs of lab activity and images from our research,
# shown to the right of the "ADEPT Lab" heading on the homepage.
#
# The original lab overview in research_figures.yml always opens the header.
# These optional photographs follow it. An empty photo list shows only the
# overview, without controls; there is no wordmark fallback.
#
# How to add one:
#
#   - Put the file in assets/img/hero/.
#   - Landscape images work best. The frame is a fixed 3:2 box that crops with
#     object-fit: cover, so any roughly landscape photo survives; portrait
#     photos get cropped hard at the top and bottom.
#   - About 1200px wide is plenty. Larger files only cost load time.
#   - alt is REQUIRED on every entry. One sentence describing what is in the
#     picture, for anyone who cannot see it. Skip the words "image of".
#   - caption is optional and prints under the picture.
#   - For a labelled diagram or plot, use `fit: contain` to keep all of it
#     visible instead of cropping. Optional width/height reserve image space.
#
# With one or more photos, the overview and photos form a slideshow with
# previous and next buttons. The overview is never cropped like a photograph.

# - image: /assets/img/hero/lab-meeting-2026-09.jpg
#   alt: Members of the ADEPT Lab at a whiteboard during a weekly meeting
#   caption: Weekly lab meeting          # optional
#
# - image: /assets/img/hero/policy-evaluation-2026-10.png
#   alt: Plots comparing learned treatment policies across simulated patient states
#   caption: Off-policy evaluation on simulated patient trajectories

# Hero slideshow — photographs of lab activity and images from our research,
# shown to the right of the "ADEPT Lab" heading on the homepage.
#
# The original lab overview below opens the header. Append photographs or
# other images after it. With only the overview there are no controls;
# there is no wordmark fallback.
#
# How to add one:
#
#   - Put the file in assets/img/hero/.
#   - Landscape images work best. The frame is a fixed 3:2 box that crops with
#     object-fit: cover, so any roughly landscape photo survives; portrait
#     photos get cropped hard at the top and bottom.
#   - About 1200px wide is plenty. Larger files only cost load time.
#   - alt is REQUIRED on every entry. One sentence describing what is in the
#     picture, for anyone who cannot see it. Skip the words "image of".
#   - caption is optional and prints under the picture.
#   - For a labelled diagram or plot, use `fit: contain` to keep all of it
#     visible instead of cropping. Optional width/height reserve image space.
#
# With one or more photos, the overview and photos form a slideshow with
# previous and next buttons. The overview is never cropped like a photograph.

- kind: overview
  image: /assets/img/research/adept-research-overview-dark.webp
  alt: >-
    A blue decision loop connects Evidence, Decisions, and Outcomes. Existing
    trajectories and selected reasoning records feed branching reasoning and
    structured-action choices. Outcomes show delayed feedback pulses,
    uncertainty, and an alternate path ending at an irreversible boundary.
    A return arrow labelled Learn from consequences leads back to Evidence.
    Below, a clinician and patient and an experimental apparatus represent
    person-centered care and scientific discovery, which motivate the whole loop.
  caption: >-
    Learning from existing evidence, choosing actions and reasoning paths, and
    adapting to consequences connect our work in person-centered care and
    scientific discovery.
  width: 1983
  height: 793


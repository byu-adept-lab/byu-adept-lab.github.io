# ============================================================================
# ADEPT Lab people. Everything on the People page and in the homepage People
# section is rendered from this file — there is no hardcoded person anywhere.
#
# `group` decides which section a person appears in:
#
#   pi            Principal investigator
#   current       Current students and lab members  (shown on the homepage)
#   past          Alumni                            (People page only)
#   collaborators External collaborators            (People page only)
#
# Empty groups hide themselves, except `current`, which falls back to the
# "open positions" panel. So you can add a `past` or `collaborators` entry
# whenever there is one, and until then those sections simply do not render.
#
# `tags` are FREEFORM. Write whatever describes the work — "RL",
# "Healthcare", "LLMs", "Delayed Feedback", anything. Chips render
# automatically. Optionally give a tag an accent colour in _data/tags.yml;
# unmapped tags still look right.
#
# `level` is the degree level — "PhD", "Master's", "Undergraduate". It renders
# as the first chip in the row, outlined rather than filled so it reads as a
# different kind of fact from the project areas that follow it. It is as
# freeform as `tags`: any string renders. Because it is a chip, a student does
# not also need `role`, which is the uppercase kicker above the name.
#
# Headshots live in assets/img/people/. Square images crop best (they are
# displayed 1:1). A person with no `photo` gets the ADEPT mark as a
# placeholder, so it is fine to add someone before you have their picture.
# ============================================================================

